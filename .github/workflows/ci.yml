name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forma_test
          POSTGRES_USER: forma
          POSTGRES_PASSWORD: forma-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forma -d forma_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://forma:forma-test-only@localhost:5432/forma_test
      TEST_DATABASE_URL: postgres://forma:forma-test-only@localhost:5432/forma_test
      BETTER_AUTH_URL: http://127.0.0.1:3001
      BETTER_AUTH_SECRET: forma-ci-only-secret-not-for-deployment
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: docker build --target runner -t forma:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: forma:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
